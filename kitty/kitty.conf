# Custom kitty config for Homa

clear_all_shortcuts yes
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
map shift+insert paste_from_clipboard
# Appearance
font_family      Fira Code Freeze
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

force_ltr no

symbol_map

narrow_symbols

disable_ligatures never

font_features

foreground      #e5e5e5
background      #1f1f1f
selection_foreground #1f1f1f
selection_background #e5e5e5

cursor         #e5e5e5
cursor_text_color #1f1f1f

url_color      #1f93ff

color0         #1f1f1f
color1         #f07178
color2         #c3e88d
color3         #ffcb6b
color4         #82aaff
color5         #c792ea
color6         #89ddff
color7         #d0d0d0
color8         #434758
color9         #f07178
color10        #c3e88d
color11        #ffcb6b
color12        #82aaff
color13        #c792ea
color14        #89ddff
color15        #ffffff

# Window behavior
confirm_os_window_close 0
scrollback_lines 10000
tab_bar_edge bottom
tab_bar_style powerline

# Cursor shape
cursor_shape beam

# Mouse behavior
mouse_hide_when_typing yes

# Kitty-specific tweaks
detect_urls yes
url_style underline

# Border & padding
# window_border_width 10
# window_margin_width 4

modify_font
modify_font underline_position 2px
modify_font cell_width -1px
modify_font cell_height 0px
modify_font baseline 2

macos_option_as_alt yes

include dracula.conf
